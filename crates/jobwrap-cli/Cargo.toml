[package]
name = "jobwrap-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The jobwrap command-line interface and local wrapper."

[[bin]]
name = "jobwrap"
path = "src/main.rs"

[dependencies]
jobwrap-core = { workspace = true }
jobwrap-config = { workspace = true }
jobwrap-protocol = { workspace = true }
jobwrap-pty = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
signal-hook = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
fd-lock = { workspace = true }

[package.metadata.deb]
maintainer = "jobwrap contributors"
copyright = "2026, jobwrap contributors"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
assets = [
  ["../../packaging/man/jobwrap.1", "usr/share/man/man1/", "644"],
  ["../../packaging/man/jobwrap.toml.5", "usr/share/man/man5/", "644"],
  ["../../packaging/man/jobwrapd.8", "usr/share/man/man8/", "644"],
  ["../../packaging/completions/jobwrap.bash", "usr/share/bash-completion/completions/jobwrap", "644"],
  ["../../packaging/completions/_jobwrap", "usr/share/zsh/vendor-completions/_jobwrap", "644"],
  ["../../packaging/completions/jobwrap.fish", "usr/share/fish/vendor_completions.d/jobwrap.fish", "644"],
  ["../../packaging/systemd/jobwrapd.service", "usr/lib/systemd/user/", "644"],
  ["../../packaging/systemd/jobwrapd.socket", "usr/lib/systemd/user/", "644"],
  ["../../README.md", "usr/share/doc/jobwrap/README.md", "644"],
  ["../../CHANGELOG.md", "usr/share/doc/jobwrap/changelog", "644"],
]
